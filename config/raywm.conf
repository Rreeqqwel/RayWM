# RayWM configuration (docs/CONFIGURATION.md).
#
# Format: [section], key = value, comments on their own line with # or ;.
# Every line below shows the built-in default; delete or comment out what
# you do not change. Loaded in this order, later files override single keys:
#   1. built-in defaults
#   2. /usr/share/raywm/config/raywm.conf   (the package's copy of this file)
#   3. ~/.config/raywm/raywm.conf           (next to init.lua; yours)
# A file with an error is ignored as a whole and the log says which line;
# on a reload the previous settings are kept. Unknown keys only warn.
# Check a file without starting RayWM:  raywm -t   (or raywm -t -c DIR/init.lua)
#
# Plugins are still loaded by init.lua; their own options (key bindings,
# rules, outputs, input devices) stay in the plugin files.

[general]
# A new window takes the keyboard focus when it appears.
focus_new_windows = true
# Super+Return; empty means $TERMINAL, else foot. Run through /bin/sh.
terminal =
# Xwayland for X11 programs and games (needs a restart to change).
xwayland = true

[appearance]
# Pixels between tiled windows (dwindle), 0..500.
inner_gaps = 8
# Pixels between tiled windows and the screen edge or a panel, 0..500.
outer_gaps = 8
# Border width in pixels, 0..64; 0 turns borders off.
border_width = 2
# #rrggbb or #rrggbbaa.
border_active = #5294e2
# Border of unfocused windows: a colour, or none.
border_inactive = none

[input]
# Hold it and drag a floating window: left button moves, right resizes.
# super, alt, ctrl or shift.
mouse_modifier = super
# Focus the window the pointer moves into (no click needed).
focus_follows_mouse = false
