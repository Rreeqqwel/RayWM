[workspace]
members = ["crates/raywm-core", "crates/raywm-compositor"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
raywm-core = { path = "crates/raywm-core" }
# Match all examples/handlers to the released v0.7.0 API, not master.
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
calloop = { version = "0.14.0", features = ["signals"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
